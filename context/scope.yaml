schema_version: 1
regions:
  - id: US
    name: United States
data_classes:
  - id: pii
    description: Synthetic customer identifiers and insurance policy information.
    handling: No real customer records in fixtures, logs, or specifications.
  - id: financial
    description: Premium schedules, requested claim amounts, and payouts.
    handling: Integer USD cents; no payment credentials or account numbers.
regulation_register:
  - id: REG-GLBA
    name: Gramm-Leach-Bliley Act
    regions: [US]
    data_classes: [pii, financial]
    applicability: candidate-requires-compliance-review
    owner_team: Compliance
  - id: REG-STATE-INSURANCE
    name: Applicable state insurance claims and privacy requirements
    regions: [US]
    data_classes: [pii, financial]
    applicability: candidate-requires-state-specific-review
    owner_team: Compliance
excluded:
  - Production deployment and real customer data
  - Live payment processing
  - Regulatory compliance certification
