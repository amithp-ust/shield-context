schema_version: 1
organization: shield-insurance
context_repository: shield-context
judge:
  enabled: false
  model: null
  rubric:
    - requirement_traceability
    - dependency_evidence
    - contract_consistency
    - regulated_data_handling
approved_models: []
tool_register:
  - id: repository-read
    purpose: Read source, contracts, and context in the seven Shield repositories.
    approval: approved
    access: read-only
  - id: repository-search
    purpose: Trace callers, dependencies, and ownership in Shield source.
