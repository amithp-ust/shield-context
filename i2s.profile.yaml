schema_version: 1
client: shield-insurance
surfaces: [copilot]
handoff: copilot-coding-agent
entry_point: unvetted-idea
context_repo: amithp-ust/shield-context
app_repo: amithp-ust/shield-policy-service
judge:
  provider: copilot
  model: unconfigured
  version: service-managed
  cli_version: ""
  allow_unpinned_model: true
  allow_mock: false
model_policy:
  approved_judges: []
  approved_session_models: []
session_models: {}
copilot:
  cli_policy_enabled: false
tool_register:
  - repository-read
  - repository-search
  - local-validation
  - publish-spec-pr
tool_review:
  status: unconfirmed
  terms_and_policies: pending-client-review
  note: Tool IDs are inventory only, not client approval.
model_review:
  status: pending-client-approval
  pinning_exception: User approved the isolated Copilot design using CLI/model ID without an immutable backend revision; this is not model approval.
